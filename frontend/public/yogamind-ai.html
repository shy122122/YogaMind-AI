        if (text.includes("child") || text.includes("婴儿")) return "child_pose";
        if (text.includes("mountain") || text.includes("山式")) return "mountain";
        if (text.includes("neck") || text.includes("颈")) return "seated_neck";
        if (text.includes("side") || text.includes("侧伸")) return "side_bend";
        if (text.includes("forward") || text.includes("前屈")) return "half_forward_fold";
        if (text.includes("lunge") || text.includes("弓步")) return "low_lunge";
        if (text.includes("bridge") || text.includes("桥式")) return "bridge";
        if (text.includes("twist") || text.includes("扭转")) return "supine_twist";
        return "standing_breath";

      function getFallbackPose(pose, index = 0) {
        const byId = FALLBACK_COURSE.poses.find(
          (fallbackPose) => fallbackPose.pose_id === pose?.pose_id
        );
        return (
          byId ||
          FALLBACK_COURSE.poses[index % FALLBACK_COURSE.poses.length] ||
          FALLBACK_COURSE.poses[0]
        );
      }

      function buildFallbackCourseForPreferences(durationMinutes, focusId, safetyId = "none", bodyStateId = "stiff") {
        const focusMeta = getOptionById(FOCUS_OPTIONS, focusId);
        const bodyStateMeta = getOptionById(BODY_STATE_OPTIONS, bodyStateId);
        const totalDurationSec = Math.max(60, Number(durationMinutes || 10) * 60);
        const rawPoses = FALLBACK_COURSE.poses.filter((pose) =>
          Array.isArray(pose.focus_tags)
            ? pose.focus_tags.includes(focusId)
            : focusId === "full_body"
        );
        const filteredPoses = rawPoses.filter(
          (pose) => !(pose.avoid_for || []).includes(safetyId)
        );
        const poses = filteredPoses.length ? filteredPoses : [FALLBACK_COURSE.poses[0]];
        const baseDuration = Math.floor(totalDurationSec / poses.length);
        const safetyTip =
          safetyId === "knee"
            ? "已避开强膝盖负重动作。"
            : safetyId === "waist"
              ? "已避开大幅扭转和强后弯。"
              : safetyId === "neck"
                ? "会优先提醒肩颈放松。"
                : "";

        return {
          ...FALLBACK_COURSE,
          course_id: `course_local_${focusId}_${safetyId}_${durationMinutes}`,
          course_title: `${durationMinutes}分钟${bodyStateMeta.label}${focusMeta.label}跟练`,
          total_duration_sec: totalDurationSec,
          plan_reason: `根据你的${focusMeta.requestText}、“${bodyStateMeta.label}”状态和 ${durationMinutes} 分钟时长，今天优先安排低强度基础动作。${safetyTip}我会把动作节奏放慢，提醒保持低频。`,
          poses: poses.map((pose, index) => ({
            ...pose,
            guidance_tip: safetyTip ? `${pose.guidance_tip} ${safetyTip}` : pose.guidance_tip,
            duration_sec:
              index === poses.length - 1
                ? totalDurationSec - baseDuration * (poses.length - 1)
                : baseDuration,
          })),
        };
      }

      function buildCourseInsight(focusMeta, bodyStateMeta, safetyMeta, durationMinutes, course) {
        if (typeof course?.plan_reason === "string" && course.plan_reason.trim()) {
          return course.plan_reason.trim();

        const poseNames = Array.isArray(course?.poses)
          ? course.poses.slice(0, 3).map((pose) => pose.pose_name).filter(Boolean)
          : [];
        const poseText = poseNames.length ? poseNames.join("、") : "低强度伸展动作";
        const safetyText =
          safetyMeta?.id && safetyMeta.id !== "none"
            ? `，并避开${safetyMeta.label}时不适合的高风险幅度`
            : "";

        return `根据你的${focusMeta.requestText}、“${bodyStateMeta.label}”状态和 ${durationMinutes} 分钟时长，今天先安排 ${poseText}${safetyText}。我会把动作节奏放慢，提醒保持低频，让你先建立舒服和稳定的感觉。`;

      function estimateCameraFraming(landmarks, poseConfig = {}) {
        const reliable = Array.isArray(landmarks)
          ? landmarks.filter(isReliableLandmark)
          : [];
        const required = poseConfig?.camera_mode_required || "half_body";
        const requiredMeta = getCameraModeMeta(required);

        if (reliable.length < 6) {
          return {
            bodyHeightRatio: 0,
            isFar: false,
            label: "等待入镜",
            helper: requiredMeta.helper,
          };
        }

        const minY = Math.min(...reliable.map((point) => point.y));
        const maxY = Math.max(...reliable.map((point) => point.y));
        const bodyHeightRatio = Math.max(0, Math.min(1, maxY - minY));
        const isFar =
          required === "full_body" && bodyHeightRatio > 0 && bodyHeightRatio < 0.56;

        return {
          bodyHeightRatio,
          isFar,
          label: isFar ? "远距离大字模式" : requiredMeta.label,
          helper: isFar ? "你站得比较远，我会放大关键提示，主要听语音即可。" : requiredMeta.helper,
        };
      }

      function formatTimer(totalSeconds) {
        const safeSeconds = Math.max(0, Math.floor(Number(totalSeconds) || 0));
        const minutes = Math.floor(safeSeconds / 60);
        const seconds = safeSeconds % 60;
        return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      function getStoredStreak() {
        try {
          const raw = window.localStorage?.getItem("yogamind_practice_streak");
          const value = Number(raw);
          return Number.isFinite(value) && value > 0 ? value : 0;
        } catch (error) {
          return 0;
        }
      }

      function updatePracticeStreak() {
        try {
          const today = new Date().toISOString().slice(0, 10);
          const lastDate = window.localStorage?.getItem("yogamind_last_practice_date");
          const currentStreak = getStoredStreak();
          const nextStreak = lastDate === today ? Math.max(1, currentStreak) : currentStreak + 1;
          window.localStorage?.setItem("yogamind_last_practice_date", today);
          window.localStorage?.setItem("yogamind_practice_streak", String(nextStreak));
          return nextStreak;
        } catch (error) {
          return 1;
        }
      }

      async function fetchJsonWithTimeout(path, payload) {
        if (API_BASE_URL === "offline") {
          throw new Error("当前为纯前端离线体验模式");
        }

        const controller = new AbortController();
        const timer = window.setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

        try {
          const response = await fetch(`${API_BASE_URL}${path}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
            signal: controller.signal,
          });

          if (!response.ok) {
            throw new Error(`API request failed: ${response.status}`);
          }

          return await response.json();
        } finally {
          window.clearTimeout(timer);
        }
      }

      function normalizePose(pose, index = 0, usedDemoUrls = null) {
        const fallback = getFallbackPose(pose, index);
        const duration = Number(pose?.duration_sec);
        const targetMin = Number(pose?.target_angle_min);
        const targetMax = Number(pose?.target_angle_max);
        const hasValidAngles =
          Number.isFinite(targetMin) &&
          Number.isFinite(targetMax) &&
          targetMin >= 0 &&
          targetMax <= 180 &&
          targetMin <= targetMax;

        const poseName = pose?.pose_name || fallback.pose_name;
        const keyPointsTip =
          typeof pose?.key_points_tip === "string" && pose.key_points_tip.trim()
            ? pose.key_points_tip
            : fallback.key_points_tip || "保持稳定呼吸，动作放慢，停在身体舒服的位置。";
        const demoVisualKey =
          typeof pose?.demo_visual_key === "string" && pose.demo_visual_key.trim()
            ? pose.demo_visual_key.trim()
            : fallback.demo_visual_key || inferDemoVisualKey(poseName, pose?.pose_id || fallback.pose_id);
        let demoMediaUrl =
          getDemoAssetUrl(demoVisualKey, poseName, pose?.pose_id || fallback.pose_id) ||
          pose?.demo_media_url ||
          fallback.demo_media_url ||
          createPoseDemoPlaceholder(poseName, keyPointsTip, demoVisualKey);

        if (usedDemoUrls?.has(demoMediaUrl)) {
          demoMediaUrl =
            pose?.demo_media_url && !usedDemoUrls.has(pose.demo_media_url)
              ? pose.demo_media_url
              : fallback.demo_media_url && !usedDemoUrls.has(fallback.demo_media_url)
              ? fallback.demo_media_url
              : createPoseDemoPlaceholder(poseName, keyPointsTip, demoVisualKey);
        }
        usedDemoUrls?.add(demoMediaUrl);

        return {
          ...fallback,
          ...pose,
          pose_id: pose?.pose_id || fallback.pose_id,
          pose_name: poseName,
          duration_sec:
            Number.isFinite(duration) && duration > 0 ? duration : fallback.duration_sec,
          target_angle_min: hasValidAngles ? targetMin : fallback.target_angle_min,
          target_angle_max: hasValidAngles ? targetMax : fallback.target_angle_max,
          guidance_tip:
            typeof pose?.guidance_tip === "string" && pose.guidance_tip.trim()
              ? pose.guidance_tip
              : fallback.guidance_tip,
          demo_media_url: demoMediaUrl,
          demo_visual_key: demoVisualKey,
          key_points_tip: keyPointsTip,
          camera_mode_required:
            typeof pose?.camera_mode_required === "string"
              ? pose.camera_mode_required
              : fallback.camera_mode_required || "half_body",
          correction_error_key:
            typeof pose?.correction_error_key === "string"
              ? pose.correction_error_key
              : fallback.correction_error_key,
        };
      }

      function normalizeCourse(course) {
        if (!Array.isArray(course?.poses) || course.poses.length === 0) {
          return FALLBACK_COURSE;
        }

        const usedDemoUrls = new Set();
        const poses = course.poses.map((pose, index) =>
          normalizePose(pose, index, usedDemoUrls)
        );
        const totalDuration = Number(course?.total_duration_sec);

        return {
          ...FALLBACK_COURSE,
          ...course,
          course_id: course?.course_id || FALLBACK_COURSE.course_id,
          course_title: course?.course_title || FALLBACK_COURSE.course_title,
          plan_reason:
            typeof course?.plan_reason === "string" && course.plan_reason.trim()
              ? course.plan_reason.trim()
              : FALLBACK_COURSE.plan_reason,
          total_duration_sec:
            Number.isFinite(totalDuration) && totalDuration > 0
              ? totalDuration
              : poses.reduce((sum, pose) => sum + pose.duration_sec, 0),
          poses,
        };
      }

        mat_fold: "垫面前屈",
        seated: "坐姿",
        side_bend: "站姿侧伸展",
        forward_fold: "站姿前屈",
        lunge: "弓步",
        bridge: "桥式",
        supine_twist: "仰卧扭转",
      };
      const POSE_VISUAL_LABELS = {
        standing_breath: "站姿呼吸",
        cat_cow: "猫牛式",
        child_pose: "婴儿式",
        mountain: "山式站立",
        seated_neck: "坐姿颈侧放松",
        side_bend: "站姿侧伸展",
        half_forward_fold: "半前屈伸展",
        low_lunge: "低弓步",
        bridge: "桥式预备",
        supine_twist: "仰卧扭转",
      };

      const POSE_FEATURE_WEIGHTS = {
        bodyRatio: 1.05,
        torsoHorizontal: 1.2,
        shoulderHipDelta: 1,
        wristShoulderDelta: 0.85,
        kneeHipDelta: 0.85,
        kneeBend: 0.95,
        sideLean: 0.7,
        lowerSpread: 0.75,
        bodyHeight: 0.65,
      };

      const POSE_FEATURE_TEMPLATES = {
        standing_breath: {
          pattern: "standing",
          features: { bodyRatio: 0.46, torsoHorizontal: 0.08, shoulderHipDelta: -0.35, wristShoulderDelta: 0.27, kneeHipDelta: 0.28, kneeBend: 0.95, sideLean: 0.05, lowerSpread: 0.18, bodyHeight: 0.78 },
        },
        mountain: {
          pattern: "standing",
          features: { bodyRatio: 0.45, torsoHorizontal: 0.07, shoulderHipDelta: -0.36, wristShoulderDelta: 0.28, kneeHipDelta: 0.28, kneeBend: 0.96, sideLean: 0.05, lowerSpread: 0.18, bodyHeight: 0.78 },
        },
        side_bend: {
          pattern: "side_bend",
          features: { bodyRatio: 0.53, torsoHorizontal: 0.26, shoulderHipDelta: -0.32, wristShoulderDelta: -0.12, kneeHipDelta: 0.28, kneeBend: 0.95, sideLean: 0.28, lowerSpread: 0.18, bodyHeight: 0.76 },
        },
        half_forward_fold: {
          pattern: "forward_fold",
          features: { bodyRatio: 0.72, torsoHorizontal: 0.55, shoulderHipDelta: -0.08, wristShoulderDelta: 0.42, kneeHipDelta: 0.28, kneeBend: 0.86, sideLean: 0.2, lowerSpread: 0.16, bodyHeight: 0.68 },
        },
        low_lunge: {
          pattern: "lunge",
          features: { bodyRatio: 0.9, torsoHorizontal: 0.14, shoulderHipDelta: -0.34, wristShoulderDelta: 0.08, kneeHipDelta: 0.16, kneeBend: 0.58, sideLean: 0.07, lowerSpread: 0.62, bodyHeight: 0.62 },
        },
        cat_cow: {
          pattern: "all_fours",
          features: { bodyRatio: 1.55, torsoHorizontal: 0.78, shoulderHipDelta: -0.02, wristShoulderDelta: 0.3, kneeHipDelta: 0.18, kneeBend: 0.56, sideLean: 0.12, lowerSpread: 0.44, bodyHeight: 0.45 },
        },
        child_pose: {
          pattern: "mat_fold",
          features: { bodyRatio: 1.75, torsoHorizontal: 0.86, shoulderHipDelta: -0.02, wristShoulderDelta: 0.05, kneeHipDelta: 0.08, kneeBend: 0.34, sideLean: 0.18, lowerSpread: 0.45, bodyHeight: 0.34 },
        },
        seated_neck: {
          pattern: "seated",
          features: { bodyRatio: 0.9, torsoHorizontal: 0.14, shoulderHipDelta: -0.3, wristShoulderDelta: 0.16, kneeHipDelta: 0.02, kneeBend: 0.28, sideLean: 0.18, lowerSpread: 0.52, bodyHeight: 0.55 },
        },
        bridge: {
          pattern: "bridge",
          features: { bodyRatio: 1.7, torsoHorizontal: 0.82, shoulderHipDelta: 0.08, wristShoulderDelta: 0.06, kneeHipDelta: 0.08, kneeBend: 0.5, sideLean: 0.12, lowerSpread: 0.48, bodyHeight: 0.34 },
        },
        supine_twist: {
          pattern: "supine_twist",
          features: { bodyRatio: 1.95, torsoHorizontal: 0.88, shoulderHipDelta: 0.02, wristShoulderDelta: 0.02, kneeHipDelta: -0.04, kneeBend: 0.42, sideLean: 0.22, lowerSpread: 0.65, bodyHeight: 0.32 },
        },
      };

      function calculateAngle(pointA, pointB, pointC) {
        if (!pointA || !pointB || !pointC) return null;
        const radians =
          Math.atan2(pointC.y - pointB.y, pointC.x - pointB.x) -
          Math.atan2(pointA.y - pointB.y, pointA.x - pointB.x);
        let angle = Math.abs((radians * 180) / Math.PI);
        if (angle > 180) angle = 360 - angle;
        return angle;
      }

      function isReliableLandmark(point) {
        if (!point) return false;
        const visibility = Number(point.visibility);
        const presence = Number(point.presence);
        if (Number.isFinite(visibility)) return visibility > 0.18;
        if (Number.isFinite(presence)) return presence > 0.18;
        return true;
      }

      function countReliableLandmarks(landmarks) {
        return Array.isArray(landmarks)
          ? landmarks.reduce((count, point) => count + (isReliableLandmark(point) ? 1 : 0), 0)
          : 0;
      }


      function getPointCenter(...points) {
        const reliable = points.filter(isReliableLandmark);
        if (!reliable.length) return null;
        return {
          x: reliable.reduce((sum, point) => sum + point.x, 0) / reliable.length,
          y: reliable.reduce((sum, point) => sum + point.y, 0) / reliable.length,
        };
      }

      function getExpectedPosePattern(poseConfig = {}) {
        const visualKey =
          poseConfig.demo_visual_key ||
          inferDemoVisualKey(poseConfig.pose_name, poseConfig.pose_id);
        const patternMap = {
          standing_breath: "standing",
          mountain: "standing",
          cat_cow: "all_fours",
          child_pose: "mat_fold",
          seated_neck: "seated",
          side_bend: "side_bend",
          half_forward_fold: "forward_fold",
          low_lunge: "lunge",
          bridge: "bridge",
          supine_twist: "supine_twist",
        };
        return patternMap[visualKey] || "standing";
      }


      function clamp01(value) {
        if (!Number.isFinite(value)) return 0;
        return Math.max(0, Math.min(1, value));
      }

      function distance2D(pointA, pointB) {
        if (!pointA || !pointB) return null;
        const dx = pointA.x - pointB.x;
        const dy = pointA.y - pointB.y;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function extractPoseFeatureVector(landmarks) {
        const bodyPoints = Array.from(BODY_KEYPOINT_INDICES)
          .map((index) => landmarks[index])
          .filter(isReliableLandmark);
        if (bodyPoints.length < 8) return null;

        const minX = Math.min(...bodyPoints.map((point) => point.x));
        const maxX = Math.max(...bodyPoints.map((point) => point.x));
        const minY = Math.min(...bodyPoints.map((point) => point.y));
        const maxY = Math.max(...bodyPoints.map((point) => point.y));
        const bodyWidth = Math.max(0.01, maxX - minX);
        const bodyHeight = Math.max(0.01, maxY - minY);
        const shoulder = getPointCenter(landmarks[11], landmarks[12]);
        const hip = getPointCenter(landmarks[23], landmarks[24]);
        const knee = getPointCenter(landmarks[25], landmarks[26]);
        const ankle = getPointCenter(landmarks[27], landmarks[28], landmarks[31], landmarks[32]);
        const wrist = getPointCenter(landmarks[15], landmarks[16]);
        const head = getPointCenter(landmarks[0], landmarks[7], landmarks[8]);
        if (!shoulder || !hip) return null;

        const torsoDx = Math.abs(shoulder.x - hip.x);
        const torsoDy = Math.abs(shoulder.y - hip.y);
        const torsoHorizontal = torsoDx / Math.max(0.01, torsoDx + torsoDy);
        const shoulderHipDelta = (shoulder.y - hip.y) / bodyHeight;
        const wristShoulderDelta = wrist ? (wrist.y - shoulder.y) / bodyHeight : 0;
        const kneeHipDelta = knee ? (knee.y - hip.y) / bodyHeight : 0;
        const rightKneeAngle = calculateAngle(landmarks[24], landmarks[26], landmarks[28]);
        const leftKneeAngle = calculateAngle(landmarks[23], landmarks[25], landmarks[27]);
        const kneeAngles = [rightKneeAngle, leftKneeAngle].filter(Number.isFinite);
        const kneeBend = kneeAngles.length
          ? kneeAngles.reduce((sum, angle) => sum + angle, 0) / kneeAngles.length / 180
          : 0.72;
        const sideLean = head ? Math.abs(head.x - hip.x) / bodyWidth : 0;
        const lowerSpread = ankle && knee ? distance2D(ankle, knee) / bodyWidth : 0;

        return {
          bodyRatio: clamp01(bodyWidth / Math.max(0.01, bodyHeight) / 2.2),
          torsoHorizontal: clamp01(torsoHorizontal),
          shoulderHipDelta: clamp01((shoulderHipDelta + 0.5) / 1.0),
          wristShoulderDelta: clamp01((wristShoulderDelta + 0.2) / 0.9),
          kneeHipDelta: clamp01((kneeHipDelta + 0.15) / 0.65),
          kneeBend: clamp01(kneeBend),
          sideLean: clamp01(sideLean / 0.7),
          lowerSpread: clamp01(lowerSpread / 1.0),
          bodyHeight: clamp01(bodyHeight / 0.9),
        };
      }

      function normalizeTemplateFeatures(features) {
        return {
          bodyRatio: clamp01((features.bodyRatio || 0) / 2.2),
          torsoHorizontal: clamp01(features.torsoHorizontal || 0),
          shoulderHipDelta: clamp01(((features.shoulderHipDelta || 0) + 0.5) / 1.0),
          wristShoulderDelta: clamp01(((features.wristShoulderDelta || 0) + 0.2) / 0.9),
          kneeHipDelta: clamp01(((features.kneeHipDelta || 0) + 0.15) / 0.65),
          kneeBend: clamp01(features.kneeBend || 0),
          sideLean: clamp01((features.sideLean || 0) / 0.7),
          lowerSpread: clamp01(features.lowerSpread || 0),
          bodyHeight: clamp01((features.bodyHeight || 0) / 0.9),
        };
      }

      function comparePoseFeatureVectors(currentFeatures, templateFeatures) {
        if (!currentFeatures || !templateFeatures) return 0;
        const normalizedTemplate = normalizeTemplateFeatures(templateFeatures);
        let weightedDistance = 0;
        let totalWeight = 0;
        Object.entries(POSE_FEATURE_WEIGHTS).forEach(([key, weight]) => {
          const delta = Math.abs((currentFeatures[key] ?? 0) - (normalizedTemplate[key] ?? 0));
          weightedDistance += delta * weight;
          totalWeight += weight;
        });
        const meanDistance = weightedDistance / Math.max(0.001, totalWeight);
        return Math.round(clamp01(1 - meanDistance) * 100) / 100;
      }

      function classifyPoseWithTemplates(landmarks) {
        const features = extractPoseFeatureVector(landmarks);
        if (!features) {
          return { key: "unknown", pattern: "unknown", score: 0, scores: {}, features: null };
        }

        const scores = Object.fromEntries(
          Object.entries(POSE_FEATURE_TEMPLATES).map(([key, template]) => [
            key,
            comparePoseFeatureVectors(features, template.features),
          ])
        );
        const [key, score] = Object.entries(scores).sort((a, b) => b[1] - a[1])[0];
        return {
          key,
          pattern: POSE_FEATURE_TEMPLATES[key]?.pattern || "unknown",
          score,
          scores,
          features,
        };
      }

      function classifyPosePattern(landmarks) {
        const bodyPoints = Array.from(BODY_KEYPOINT_INDICES)
          .map((index) => landmarks[index])
          .filter(isReliableLandmark);
        if (bodyPoints.length < 8) return { pattern: "unknown", confidence: 0 };

        const minX = Math.min(...bodyPoints.map((point) => point.x));
        const maxX = Math.max(...bodyPoints.map((point) => point.x));
        const minY = Math.min(...bodyPoints.map((point) => point.y));
        const maxY = Math.max(...bodyPoints.map((point) => point.y));
        const bodyWidth = Math.max(0.01, maxX - minX);
        const bodyHeight = Math.max(0.01, maxY - minY);
        const shoulder = getPointCenter(landmarks[11], landmarks[12]);
        const hip = getPointCenter(landmarks[23], landmarks[24]);
        const knee = getPointCenter(landmarks[25], landmarks[26]);
        const ankle = getPointCenter(landmarks[27], landmarks[28], landmarks[31], landmarks[32]);
        const wrist = getPointCenter(landmarks[15], landmarks[16]);
        const head = getPointCenter(landmarks[0], landmarks[7], landmarks[8]);

        if (!shoulder || !hip) return { pattern: "unknown", confidence: 0 };

        const torsoDx = Math.abs(shoulder.x - hip.x);
        const torsoDy = Math.abs(shoulder.y - hip.y);
        const isHorizontalBody = bodyWidth > bodyHeight * 1.22 || torsoDx > torsoDy * 1.25;
        const isVerticalBody = bodyHeight > bodyWidth * 1.12 && torsoDy > torsoDx * 1.05;
        const lowerBodyVisible = Boolean(knee && ankle);
        const shoulderAboveHip = shoulder.y < hip.y - 0.08;
        const handsNearFloor = wrist ? wrist.y > shoulder.y + 0.18 : false;
        const kneesNearHands = wrist && knee ? Math.abs(wrist.y - knee.y) < 0.2 : false;
        const hipsLow = hip.y > 0.48;

        if (lowerBodyVisible) {
          const rightKneeAngle = calculateAngle(landmarks[24], landmarks[26], landmarks[28]);
          const leftKneeAngle = calculateAngle(landmarks[23], landmarks[25], landmarks[27]);
          const kneeAngles = [rightKneeAngle, leftKneeAngle].filter(Number.isFinite);
          const hasBentKnee = kneeAngles.some((angle) => angle > 70 && angle < 135);
          const hasLongStride = bodyWidth > 0.48 && ankle && knee && Math.abs(ankle.x - knee.x) > 0.12;
          if (hasBentKnee && hasLongStride && bodyHeight > 0.45) {
            return { pattern: "lunge", confidence: 0.78 };
          }
        }

        if (isHorizontalBody && handsNearFloor && kneesNearHands && hip.y > shoulder.y - 0.06) {
          return { pattern: "all_fours", confidence: 0.82 };
        }

        if (isHorizontalBody && hip.y > 0.5 && head && head.y > hip.y - 0.18 && bodyHeight < 0.46) {
          const isBridgeLike = knee && shoulder && hip.y < knee.y - 0.05 && shoulder.y > hip.y - 0.04;
          if (isBridgeLike) return { pattern: "bridge", confidence: 0.72 };
          const isTwistLike = bodyWidth > 0.56 && lowerBodyVisible;
          if (isTwistLike) return { pattern: "supine_twist", confidence: 0.7 };
          return { pattern: "mat_fold", confidence: 0.64 };
        }

        if (isHorizontalBody && hip.y > 0.44 && handsNearFloor) {
          return { pattern: "mat_fold", confidence: 0.72 };
        }

        if (hipsLow && knee && Math.abs(knee.y - hip.y) < 0.18 && bodyWidth > bodyHeight * 0.78) {
          return { pattern: "seated", confidence: 0.76 };
        }

        if (isVerticalBody && lowerBodyVisible && shoulderAboveHip && hip.y > 0.34) {
          const sideOffset = Math.abs((head?.x || shoulder.x) - hip.x);
          const forwardFoldLike = shoulder.y > hip.y - 0.08 && torsoDx > torsoDy * 0.6;
          if (forwardFoldLike) return { pattern: "forward_fold", confidence: 0.76 };
          if (sideOffset > bodyWidth * 0.18) return { pattern: "side_bend", confidence: 0.68 };
          return { pattern: "standing", confidence: 0.84 };
        }

        return { pattern: "unknown", confidence: 0.24 };
      }

      function evaluatePosePatternMismatch(landmarks, poseConfig = {}) {
        const expected = getExpectedPosePattern(poseConfig);
        const expectedVisualKey =
          poseConfig.demo_visual_key ||
          inferDemoVisualKey(poseConfig.pose_name, poseConfig.pose_id);
        const templateMatch = classifyPoseWithTemplates(landmarks);
        const templateScore = templateMatch.scores?.[expectedVisualKey] || 0;
        const bestTemplateIsDifferent =
          templateMatch.key !== "unknown" &&
          templateMatch.key !== expectedVisualKey &&
          templateMatch.score >= 0.64 &&
          templateScore < 0.58 &&
          templateMatch.score - templateScore >= 0.08;

        if (bestTemplateIsDifferent) {
          return {
            mismatched: true,
            expected,
            actual: { pattern: templateMatch.pattern, confidence: templateMatch.score },
            label: "动作匹配度低",
            tip:
              "现在更像" +
              (POSE_VISUAL_LABELS[templateMatch.key] || POSE_PATTERN_LABELS[templateMatch.pattern] || "其他动作") +
              "，" + getPoseEntryInstruction(expected),
            errorIndices: [11, 12, 23, 24, 25, 26],
          };
        }

        const actual = classifyPosePattern(landmarks);
        if (actual.pattern === "unknown" || actual.confidence < 0.62) {
          const isExpectedTemplateTooLow = templateScore > 0 && templateScore < 0.5;
          return {
            mismatched: isExpectedTemplateTooLow,
            expected,
            actual,
            label: "动作匹配度低",
            tip:
              "我还没对上当前示范动作，请对照" +
              (POSE_VISUAL_LABELS[expectedVisualKey] || POSE_PATTERN_LABELS[expected] || "示范动作") +
              "。" + getPoseEntryInstruction(expected),
            errorIndices: [11, 12, 23, 24],
          };
        }

        const compatible = {
          standing: ["standing", "side_bend"],
          side_bend: ["side_bend", "standing"],
          forward_fold: ["forward_fold", "standing"],
          bridge: ["bridge", "supine_twist"],
          supine_twist: ["supine_twist", "bridge"],
        };
        const allowed = compatible[expected] || [expected];
        const mismatched = !allowed.includes(actual.pattern);
        return {
          mismatched,
          expected,
          actual,
          label: "动作不匹配",
          tip:
            "现在识别到的是" +
            (POSE_PATTERN_LABELS[actual.pattern] || "其他动作") +
            "，" + getPoseEntryInstruction(expected),
          errorIndices: [11, 12, 23, 24, 25, 26],
        };
      }

      function evaluatePoseDeviation(landmarks, poseConfig = FALLBACK_COURSE.poses[0]) {
        if (!Array.isArray(landmarks) || landmarks.length < 33) {
          return {
            hasPose: false,
            hasDeviation: false,
            visibleCount: 0,
            angle: null,
            errorIndices: [],
            label: "等待识别",
            quality: "no_pose",
          };
        }

        const visibleCount = landmarks.reduce(
          (count, point) => count + (isReliableLandmark(point) ? 1 : 0),
          0
        );
        const ruleKey = poseConfig?.cv_rule_key || "spine_extension";
        const targetMin = Number(poseConfig?.target_angle_min ?? 140);
        const targetMax = Number(poseConfig?.target_angle_max ?? 180);
        const framing = estimateCameraFraming(landmarks, poseConfig);
        const cameraModeRequired = poseConfig?.camera_mode_required || "half_body";
        const minVisibleCount =
          cameraModeRequired === "full_body" ? 18 : cameraModeRequired === "mat_view" ? 10 : 8;

        if (visibleCount < minVisibleCount) {
          return {
            hasPose: visibleCount >= 8,
            hasDeviation: false,
            visibleCount,
            angle: null,
            errorIndices: [],
            label: `${getCameraModeMeta(cameraModeRequired).short}关键点不足`,
            framing,
            quality: visibleCount > 0 ? "partial_body" : "no_pose",
          };
        }

        const patternMismatch = evaluatePosePatternMismatch(landmarks, poseConfig);
        if (patternMismatch.mismatched) {
          return {
            hasPose: true,
            hasDeviation: true,
            visibleCount,
            angle: null,
            errorIndices: patternMismatch.errorIndices,
            label: patternMismatch.label,
            tip: patternMismatch.tip,
            framing,
            quality: "partial_body",
            mismatch: patternMismatch,
          };
        }

        if (ruleKey === "shoulder_relax") {
          const leftEar = landmarks[7];
          const rightEar = landmarks[8];
          const leftShoulder = landmarks[11];
          const rightShoulder = landmarks[12];
          const leftHip = landmarks[23];
          const rightHip = landmarks[24];
          const needed = [leftEar, rightEar, leftShoulder, rightShoulder, leftHip, rightHip];
          if (!needed.every(isReliableLandmark)) {
            return {
              hasPose: true,
              hasDeviation: false,
              visibleCount,
            angle: null,
            errorIndices: [],
            label: "肩颈关键点不足",
            framing,
          };
          }

          const shoulderY = (leftShoulder.y + rightShoulder.y) / 2;
          const earY = (leftEar.y + rightEar.y) / 2;
          const hipY = (leftHip.y + rightHip.y) / 2;
          const bodyScale = Math.max(0.08, Math.abs(hipY - shoulderY));
          const relaxScore = Math.round(((shoulderY - earY) / bodyScale) * 100);
          const hasDeviation = relaxScore < 30;
          return {
            hasPose: true,
            hasDeviation,
            visibleCount,
            angle: relaxScore,
            errorIndices: hasDeviation ? [11, 12] : [],
            label: "沉肩空间",
            framing,
          };
        }

        if (ruleKey === "knee_alignment") {
          const rightKneeAngle = calculateAngle(landmarks[24], landmarks[26], landmarks[28]);
          const leftKneeAngle = calculateAngle(landmarks[23], landmarks[25], landmarks[27]);
          const candidates = [
            { side: "右膝稳定度", angle: rightKneeAngle, indices: [24, 26, 28] },
            { side: "左膝稳定度", angle: leftKneeAngle, indices: [23, 25, 27] },
          ].filter((item) => Number.isFinite(item.angle));

          if (!candidates.length) {
            return {
              hasPose: true,
              hasDeviation: false,
              visibleCount,
              angle: null,
              errorIndices: [],
              label: "膝盖关键点不足",
              framing,
            };
          }

          const tightest = candidates.reduce((worst, current) =>
            current.angle < worst.angle ? current : worst
          );
          const hasDeviation = tightest.angle < targetMin || tightest.angle > targetMax;
          return {
            hasPose: true,
            hasDeviation,
            visibleCount,
            angle: Math.round(tightest.angle),
            errorIndices: hasDeviation ? tightest.indices : [],
            label: tightest.side,
            framing,
          };
        }

        if (ruleKey === "hip_stability") {
          const leftHip = landmarks[23];
          const rightHip = landmarks[24];
          const leftShoulder = landmarks[11];
          const rightShoulder = landmarks[12];
          const needed = [leftHip, rightHip, leftShoulder, rightShoulder];
          if (!needed.every(isReliableLandmark)) {
            return {
              hasPose: true,
              hasDeviation: false,
              visibleCount,
              angle: null,
              errorIndices: [],
              label: "骨盆关键点不足",
              framing,
            };
          }

          const shoulderWidth = Math.max(0.04, Math.abs(leftShoulder.x - rightShoulder.x));
          const hipTiltScore = Math.round((Math.abs(leftHip.y - rightHip.y) / shoulderWidth) * 100);
          const hasDeviation = hipTiltScore > 28;
          return {
            hasPose: true,
            hasDeviation,
            visibleCount,
            angle: hipTiltScore,
            errorIndices: hasDeviation ? [23, 24] : [],
            label: "骨盆稳定",
            framing,
          };
        }

        const rightBodyAngle = calculateAngle(landmarks[12], landmarks[24], landmarks[26]);
        const leftBodyAngle = calculateAngle(landmarks[11], landmarks[23], landmarks[25]);
        const candidates = [
          { side: "右侧脊柱线", angle: rightBodyAngle, indices: [12, 24, 26] },
          { side: "左侧脊柱线", angle: leftBodyAngle, indices: [11, 23, 25] },
        ].filter((item) => Number.isFinite(item.angle));

        if (!candidates.length) {
          return {
            hasPose: true,
            hasDeviation: false,
            visibleCount,
            angle: null,
            errorIndices: [],
            label: "关键点不足",
            framing,
          };
        }

        const tightest = candidates.reduce((worst, current) =>
          current.angle < worst.angle ? current : worst
        );
        const hasDeviation = tightest.angle < targetMin || tightest.angle > targetMax;

        return {
          hasPose: true,
          hasDeviation,
          visibleCount,
          angle: Math.round(tightest.angle),
          errorIndices: hasDeviation ? tightest.indices : [],
          label: tightest.side,
          framing,
        };
      }

      function fitCanvasToElement(canvas) {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const width = Math.max(1, Math.round(rect.width));
        const height = Math.max(1, Math.round(rect.height));
        const pixelWidth = Math.round(width * dpr);
        const pixelHeight = Math.round(height * dpr);

        if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
          canvas.width = pixelWidth;
          canvas.height = pixelHeight;
        }

        const context = canvas.getContext("2d");
        context.setTransform(dpr, 0, 0, dpr, 0, 0);
        context.clearRect(0, 0, width, height);
        return { context, width, height };
      }

      function mapLandmarkToCanvas(point, video, width, height, mirrored) {
        const videoWidth = video?.videoWidth || width;
        const videoHeight = video?.videoHeight || height;
        const videoRatio = videoWidth / videoHeight;
        const canvasRatio = width / height;
        let renderWidth = width;
        let renderHeight = height;
        let offsetX = 0;
        let offsetY = 0;

        if (canvasRatio > videoRatio) {
          renderHeight = width / videoRatio;
          offsetY = (height - renderHeight) / 2;
        } else {
          renderWidth = height * videoRatio;
          offsetX = (width - renderWidth) / 2;
        }

        const normalizedX = mirrored ? 1 - point.x : point.x;
        return {
          x: offsetX + normalizedX * renderWidth,
          y: offsetY + point.y * renderHeight,
        };
      }

      function drawPoseCanvas(canvas, video, landmarks, options = {}) {
        if (!canvas) return;
        const { context, width, height } = fitCanvasToElement(canvas);
        if (!Array.isArray(landmarks) || landmarks.length < 33) return;

        const mirrored = Boolean(options.mirrored);
        const errorSet = new Set(options.errorIndices || []);
        const connections = POSE_CONNECTIONS_FALLBACK;
        const points = landmarks.map((point) =>
          mapLandmarkToCanvas(point, video, width, height, mirrored)
        );
        drawSkeleton(context, points, landmarks, connections, errorSet);
      }

      function drawSkeleton(context, points, landmarks, connections, errorSet) {
        context.save();
        context.lineCap = "round";
        context.lineJoin = "round";

        connections.forEach(([from, to]) => {
          if (!isReliableLandmark(landmarks[from]) || !isReliableLandmark(landmarks[to])) return;
          const isProblem = errorSet.has(from) || errorSet.has(to);
          const a = points[from];
          const b = points[to];
          context.beginPath();
          context.moveTo(a.x, a.y);
          context.lineTo(b.x, b.y);
          context.strokeStyle = isProblem ? "rgba(243, 154, 114, 0.82)" : "rgba(106, 196, 190, 0.62)";
          context.lineWidth = isProblem ? 3.2 : 1.7;
          context.shadowColor = isProblem ? "rgba(243, 154, 114, 0.22)" : "rgba(106, 196, 190, 0.14)";
          context.shadowBlur = isProblem ? 10 : 4;
          context.stroke();
        });

        landmarks.forEach((landmark, index) => {
          if (!BODY_KEYPOINT_INDICES.has(index)) return;
          if (!isReliableLandmark(landmark)) return;
          const point = points[index];
          const isProblem = errorSet.has(index);
          context.beginPath();
          context.arc(point.x, point.y, isProblem ? 9 : 5, 0, Math.PI * 2);
          context.fillStyle = isProblem ? "rgba(243, 154, 114, 0.16)" : "rgba(106, 196, 190, 0.10)";
          context.fill();

          context.beginPath();
          context.arc(point.x, point.y, isProblem ? 4.8 : 2.8, 0, Math.PI * 2);
          context.fillStyle = isProblem ? "rgba(243, 154, 114, 0.96)" : "rgba(106, 196, 190, 0.82)";
          context.shadowColor = isProblem ? "rgba(243, 154, 114, 0.34)" : "rgba(106, 196, 190, 0.18)";
          context.shadowBlur = isProblem ? 10 : 4;
          context.fill();
        });

        context.restore();
      }

      const alignmentSteps = [
        {

          helper: "请站到垫子中央。先不用摆姿势，自然站好就行。",
          tone: "bg-[#EEF2F8] text-forest/66 border-[#DCE6F8]",

          progress: 68,
        },
        {
          label: "站位引导完成",

      function buildSessionMetrics(sessionStats) {
        const durationSec = sessionStats?.durationSec || 600;
        const durationMin = Math.max(1, Math.round(durationSec / 60));
        const accuracy = sessionStats?.accuracy || 88;
        const calories = Math.max(12, Math.round(durationMin * 4.2));

        return [
          { label: "体式稳定度", value: `${accuracy}%`, note: "今日表现" },
          { label: "练习时长", value: `${durationMin} 分钟`, note: "新手友好" },
          { label: "预计消耗", value: `${calories} kcal`, note: "轻柔强度" },
        ];
      }

      const Icon = ({ type, className = "h-5 w-5" }) => {
        const common = {
          className,
          viewBox: "0 0 24 24",
          fill: "none",
          stroke: "currentColor",
          strokeWidth: "1.8",

        };

        const paths = {
          leaf: (
            <>
              <path d="M5.4 18.6c7.8.6 12.8-4.4 13.2-12.2C10.8 6 5.8 11 5.4 18.6Z" />

            </>
          ),
          play: <path d="M9 7.4v9.2l7.2-4.6L9 7.4Z" />,

          ),

          ),
          skip: (

              <path d="M6.5 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" />
              <path d="M17.5 8.8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" />

              <path d="m18.4 16.2.6 1.9 1.9.6-1.9.6-.6 1.9-.6-1.9-1.9-.6 1.9-.6.6-1.9Z" />
            </>
          ),
        };

        return <svg {...common}>{paths[type]}</svg>;
      };

      function App() {
        const [activeView, setActiveView] = useState("align");
        const [alignmentStep, setAlignmentStep] = useState(0);
        const [formError, setFormError] = useState(false);
        const [paused, setPaused] = useState(false);
        const [muted, setMuted] = useState(false);
        const [posterOpen, setPosterOpen] = useState(false);
        const [summaryOpen, setSummaryOpen] = useState(false);
        const [course, setCourse] = useState(FALLBACK_COURSE);
        const [poseIndex, setPoseIndex] = useState(0);
        const [currentPose, setCurrentPose] = useState(FALLBACK_COURSE.poses[0]);
        const [sessionSummary, setSessionSummary] = useState(FALLBACK_SESSION_SUMMARY);
        const [secondsLeft, setSecondsLeft] = useState(FALLBACK_COURSE.poses[0].duration_sec);
        const [cameraMode, setCameraMode] = useState("front");
        const [autoStartCount, setAutoStartCount] = useState(3);
        const [loading, setLoading] = useState(false);
        const [loadingText, setLoadingText] = useState("正在为你安排今天的轻练习...");
        const [toast, setToast] = useState("");
        const [selectedFocus, setSelectedFocus] = useState("shoulder");
        const [selectedDuration, setSelectedDuration] = useState(10);
        const [selectedBodyState, setSelectedBodyState] = useState("stiff");
        const [selectedSafety, setSelectedSafety] = useState("none");
        const [transitionPlan, setTransitionPlan] = useState(null);
        const [transitionCount, setTransitionCount] = useState(3);
        const [onboardingOpen, setOnboardingOpen] = useState(() => {
          try { return window.localStorage.getItem("yogamind_onboarding_done") !== "1"; } catch (error) { return true; }
        });
        const [demoMode, setDemoMode] = useState(false);
        const [practiceStreak, setPracticeStreak] = useState(() => getStoredStreak());
        const [nextPractice, setNextPractice] = useState("下次可以继续做 8 分钟肩颈舒缓，保持今天这种不着急的节奏。");
        const [sessionStats, setSessionStats] = useState({
          accuracy: 88,
          durationSec: FALLBACK_COURSE.total_duration_sec,
        });
        const [errorCounts, setErrorCounts] = useState({
          shoulder_high: 0,
          knee_inward: 0,
          spine_rounding: 0,
          hip_shift: 0,
        });
        const toastTimerRef = useRef(null);
        const errorCountsRef = useRef(errorCounts);
        const courseRef = useRef(course);
        const poseIndexRef = useRef(poseIndex);
        const startInFlightRef = useRef(false);
        const finishInFlightRef = useRef(false);
        const practiceStartedAtRef = useRef(null);

        const showOfflineToast = (message = "网络连接较弱，已为你开启离线跟练模式") => {
          setToast(message);
          if (toastTimerRef.current) window.clearTimeout(toastTimerRef.current);
          toastTimerRef.current = window.setTimeout(() => setToast(""), 3600);
        };

        const selectedFocusMeta = useMemo(
          () => getOptionById(FOCUS_OPTIONS, selectedFocus),
          [selectedFocus]
        );
        const selectedBodyStateMeta = useMemo(
          () => getOptionById(BODY_STATE_OPTIONS, selectedBodyState),
          [selectedBodyState]
        );
        const selectedSafetyMeta = useMemo(
          () => getOptionById(SAFETY_OPTIONS, selectedSafety),
          [selectedSafety]
        );
        const courseInsight = useMemo(
          () =>
            buildCourseInsight(
              selectedFocusMeta,
              selectedBodyStateMeta,
              selectedSafetyMeta,
              selectedDuration,
              course
            ),
          [selectedFocusMeta, selectedBodyStateMeta, selectedSafetyMeta, selectedDuration, course]
        );

        useEffect(() => {
          const urls = Array.isArray(course?.poses)
            ? course.poses.map((pose) => pose.demo_media_url).filter(Boolean)
            : [];
          urls.forEach((url) => {
            const img = new Image();
            img.decoding = "async";
            img.src = url;
          });
        }, [course]);

        const resetPracticeStats = () => {
          const nextCounts = {
            shoulder_high: 0,
            knee_inward: 0,
            spine_rounding: 0,
            hip_shift: 0,
          };
          errorCountsRef.current = nextCounts;
          setErrorCounts(nextCounts);
          finishInFlightRef.current = false;
        };

        const recordFormError = (errorKey = "shoulder_high") => {
          const allowedKeys = ["shoulder_high", "knee_inward", "spine_rounding", "hip_shift"];
          const safeKey = allowedKeys.includes(errorKey) ? errorKey : "shoulder_high";
          const nextCounts = {
            ...errorCountsRef.current,
            [safeKey]: (errorCountsRef.current[safeKey] || 0) + 1,
          };
          errorCountsRef.current = nextCounts;
          setErrorCounts(nextCounts);
        };

        const startPractice = async () => {
          if (!alignmentReady || loading || startInFlightRef.current) return;
          setDemoMode(false);

          startInFlightRef.current = true;
          setLoadingText(
            `正在根据你的${selectedFocusMeta.requestText}和 ${selectedDuration} 分钟时长安排练习...`
          );
          setLoading(true);
          resetPracticeStats();

          try {
            const generatedCourse = await fetchJsonWithTimeout("/api/v1/course/generate", {
              user_level: "beginner",
              target_focus: selectedFocus,
              duration_minutes: selectedDuration,
              body_state: selectedBodyState,
              safety: selectedSafety,
            });
            const safeCourse = normalizeCourse(generatedCourse);
            const firstPose = safeCourse.poses[0] || FALLBACK_COURSE.poses[0];
            setCourse(safeCourse);
            setPoseIndex(0);
            setCurrentPose(firstPose);
            setSecondsLeft(firstPose.duration_sec || 60);
            practiceStartedAtRef.current = Date.now();
          } catch (error) {
            const localCourse = buildFallbackCourseForPreferences(
              selectedDuration,
              selectedFocus,
              selectedSafety,
              selectedBodyState
            );
            showOfflineToast();
            setCourse(localCourse);
            setPoseIndex(0);
            setCurrentPose(localCourse.poses[0]);
            setSecondsLeft(localCourse.poses[0].duration_sec);
            practiceStartedAtRef.current = Date.now();
          } finally {
            startInFlightRef.current = false;
            setLoading(false);
            setActiveView("practice");
            setPaused(false);
            setFormError(false);
          }
        };

        const startDemoPractice = () => {
          if (loading || startInFlightRef.current) return;
          startInFlightRef.current = true;
          resetPracticeStats();
          const localCourse = buildFallbackCourseForPreferences(selectedDuration, selectedFocus, selectedSafety, selectedBodyState);
          const firstPose = localCourse.poses[0] || FALLBACK_COURSE.poses[0];
          setDemoMode(true); setCourse(localCourse); setPoseIndex(0); setCurrentPose(firstPose); setSecondsLeft(firstPose.duration_sec || 60);
          practiceStartedAtRef.current = Date.now(); setFormError(false); setPaused(false); setActiveView("practice"); startInFlightRef.current = false;
          showOfflineToast("已进入演示模式，不依赖摄像头和后端");
        };
        const closeOnboarding = () => { setOnboardingOpen(false); try { window.localStorage.setItem("yogamind_onboarding_done", "1"); } catch (error) {} };

        const advancePoseOrFinish = () => {
          const activeCourse = courseRef.current || FALLBACK_COURSE;
          const currentIndex = poseIndexRef.current;
          const nextPose = activeCourse.poses?.[currentIndex + 1];

          if (nextPose) {
            const normalizedNextPose = normalizePose(nextPose);
            setFormError(false);
            setPaused(true);
            setTransitionPlan({
              pose: normalizedNextPose,
              index: currentIndex + 1,
            });
            setTransitionCount(3);
            return;
          }

          finishPractice();
        };

        const finishPractice = async () => {
          if (finishInFlightRef.current) return;

          finishInFlightRef.current = true;
          setPaused(true);
          setLoadingText("正在整理本次练习总结...");
          setLoading(true);

          const activeCourse = courseRef.current || FALLBACK_COURSE;
          const elapsedFromStart = practiceStartedAtRef.current
            ? Math.round((Date.now() - practiceStartedAtRef.current) / 1000)
            : 0;
          const totalErrors = Object.values(errorCountsRef.current).reduce(
            (sum, value) => sum + value,
            0
          );
          const accuracyScore = Math.max(72, Math.min(96, 92 - totalErrors * 2));
          const plannedDurationSec = activeCourse.total_duration_sec || selectedDuration * 60;
          const actualDurationSec = Math.max(
            1,
            Math.min(plannedDurationSec, elapsedFromStart || plannedDurationSec)
          );
          setSessionStats({
            accuracy: accuracyScore,
            durationSec: actualDurationSec,
            courseTitle: activeCourse.course_title,
            bestPoseName: currentPose?.pose_name || activeCourse.poses?.[0]?.pose_name || "今日练习",
          });
          const updatedStreak = updatePracticeStreak();
          setPracticeStreak(updatedStreak);
          setNextPractice(
            buildNextPracticeRecommendation(errorCountsRef.current, selectedFocusMeta.label)
          );

          try {
            const summary = await fetchJsonWithTimeout("/api/v1/session/submit", {
              course_id: activeCourse.course_id,
              actual_duration_sec: actualDurationSec,
              accuracy_score: accuracyScore,
              error_counts: errorCountsRef.current,
            });
            const safeSummary = normalizeSessionSummary(summary);
            setSessionSummary(safeSummary);
            setNextPractice(
              safeSummary.next_practice_suggestion ||
                buildNextPracticeRecommendation(errorCountsRef.current, selectedFocusMeta.label)
            );
          } catch (error) {
            showOfflineToast("网络连接较弱，已为你生成离线练习总结");
            const offlineNextPractice = buildNextPracticeRecommendation(
              errorCountsRef.current,
              selectedFocusMeta.label
            );
            setNextPractice(offlineNextPractice);
            setSessionSummary({
              ...FALLBACK_SESSION_SUMMARY,
              ai_feedback: `今天你完成了约 ${Math.round(
                (activeCourse.total_duration_sec || 600) / 60
              )} 分钟练习，整体标准率约 ${accuracyScore}%。继续保持沉肩呼吸，动作不用很大，稳定就是很好的进步。`,
              next_practice_suggestion: offlineNextPractice,
            });
          } finally {
            setLoading(false);
            setActiveView("summary");
            setSummaryOpen(true);
          }
        };

        const alignmentReady = alignmentStep === 2;

        useEffect(() => {
          if (activeView !== "align") return;
          setAlignmentStep(0);
          setAutoStartCount(3);
          const timers = [
            window.setTimeout(() => setAlignmentStep(1), 1200),
            window.setTimeout(() => setAlignmentStep(2), 2800),
          ];
          return () => timers.forEach(window.clearTimeout);
        }, [activeView]);

        useEffect(() => {
          if (activeView !== "practice" || paused) return;
          const interval = window.setInterval(() => {
            setSecondsLeft((value) => {
              if (value > 1) return value - 1;
              window.setTimeout(advancePoseOrFinish, 0);
              return 0;
            });
          }, 1000);
          return () => window.clearInterval(interval);
        }, [activeView, paused]);

        useEffect(() => {
          if (activeView !== "align" || alignmentStep !== 2) return;

          if (autoStartCount <= 0) {
            return;
          }

          const timer = window.setTimeout(() => {
            setAutoStartCount((value) => value - 1);
          }, 1000);

          return () => window.clearTimeout(timer);
        }, [activeView, alignmentStep, autoStartCount]);

        useEffect(() => {
          if (!transitionPlan) return;

          if (transitionCount <= 0) {
            setPoseIndex(transitionPlan.index);
            poseIndexRef.current = transitionPlan.index;
            setCurrentPose(transitionPlan.pose);
            setSecondsLeft(transitionPlan.pose.duration_sec || 60);
            setTransitionPlan(null);
            setTransitionCount(3);
            setPaused(false);
            return;
          }

          const timer = window.setTimeout(() => {
            setTransitionCount((value) => value - 1);
          }, 1000);

          return () => window.clearTimeout(timer);
        }, [transitionPlan, transitionCount]);

        useEffect(() => {
          if (activeView !== "practice") {
            setTransitionPlan(null);
            setTransitionCount(3);
          }
        }, [activeView]);

        useEffect(() => {
          courseRef.current = course;
        }, [course]);

        useEffect(() => {
          poseIndexRef.current = poseIndex;
        }, [poseIndex]);

        useEffect(() => {
          return () => {
            if (toastTimerRef.current) window.clearTimeout(toastTimerRef.current);
          };
        }, []);

        useEffect(() => {
          if (!posterOpen) return;
          const previousOverflow = document.body.style.overflow;
          document.body.style.overflow = "hidden";
          return () => {
            document.body.style.overflow = previousOverflow;
          };
        }, [posterOpen]);

        const backHome = () => {
          setActiveView("align");
          setFormError(false);
          setPaused(false);
          setPosterOpen(false);
          setSummaryOpen(false);
          setPoseIndex(0);
          setTransitionPlan(null);
          setTransitionCount(3);
          startInFlightRef.current = false;
          finishInFlightRef.current = false;
        };

        const hasNextPose = Boolean(course.poses?.[poseIndex + 1]);

        return (
          <main className="min-h-[100dvh] overflow-hidden pb-24 text-forest sm:pb-0">

                  {activeView === "align" && (
                    <AlignmentView
                      step={alignmentStep}
                      ready={alignmentReady}
                      countdown={autoStartCount}
                      loading={loading}
                      selectedFocus={selectedFocus}
                      setSelectedFocus={setSelectedFocus}
                      selectedDuration={selectedDuration}
                      setSelectedDuration={setSelectedDuration}
                      selectedBodyState={selectedBodyState}
                      setSelectedBodyState={setSelectedBodyState}
                      selectedSafety={selectedSafety}
                      setSelectedSafety={setSelectedSafety}
                      selectedFocusMeta={selectedFocusMeta}
                      selectedBodyStateMeta={selectedBodyStateMeta}
                      selectedSafetyMeta={selectedSafetyMeta}
                      onStart={startPractice}
                      onStartDemo={startDemoPractice}
                      onOpenGuide={() => setOnboardingOpen(true)}
                    />
                  )}
                  {activeView === "practice" && (
                    <PracticeView
                      formError={formError}
                      setFormError={setFormError}
                      paused={paused}
                      setPaused={setPaused}
                      muted={muted}
                      setMuted={setMuted}
                      cameraMode={cameraMode}
                      setCameraMode={setCameraMode}
                      secondsLeft={secondsLeft}
                      currentPose={currentPose}
                      poseIndex={poseIndex}
                      poseCount={course.poses?.length || 1}
                      courseInsight={courseInsight}
                      errorCounts={errorCounts}
                      hasNextPose={hasNextPose}
                      demoMode={demoMode}
                      onFormErrorConfirmed={recordFormError}
                      onSummary={advancePoseOrFinish}
                      onExit={backHome}
                    />
                  )}
                  {activeView === "summary" && (
                    <SummaryView
                      sessionSummary={sessionSummary}
                      nextPractice={nextPractice}
                      practiceStreak={practiceStreak}
                      sessionStats={sessionStats}
                      onPoster={() => setPosterOpen(true)}
                      onBackHome={backHome}

                  )}

            </div>

            {onboardingOpen && <OnboardingModal onClose={closeOnboarding} />}
            {toast && <Toast message={toast} />}
            {loading && <LoadingOverlay message={loadingText} />}
            {transitionPlan && (
              <PoseTransitionOverlay pose={transitionPlan.pose} countdown={transitionCount} />
            )}
            {summaryOpen && (
              <SessionSummaryModal
                summary={sessionSummary}
                onClose={() => setSummaryOpen(false)}
                onPoster={() => {
                  setSummaryOpen(false);
                  setPosterOpen(true);
                }}
              />
            )}
            {posterOpen && (
              <SharePosterModal
                onClose={() => setPosterOpen(false)}

              />

            <MobileTabBar activeView={activeView} setActiveView={setActiveView} />
          </main>
        );

      function LoadingOverlay({ message }) {
        return (
          <div className="fixed inset-0 z-40 grid place-items-center bg-linen/88 px-6 backdrop-blur-md">
            <section className="w-full max-w-sm rounded-[32px] border border-white/80 bg-cream p-7 text-center shadow-soft">
              <div className="mx-auto grid h-20 w-20 place-items-center rounded-[28px] bg-night">
