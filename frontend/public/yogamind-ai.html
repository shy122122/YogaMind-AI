        muted,
        setMuted,
        cameraMode,
        setCameraMode,
        secondsLeft,
        currentPose = FALLBACK_COURSE.poses[0],
        poseIndex = 0,
        poseCount = 1,
        courseInsight,
        errorCounts,
        hasNextPose,
        onFormErrorConfirmed,
        onSummary,
        onExit,
        demoMode = false,
      }) {
        const videoRef = useRef(null);
        const canvasRef = useRef(null);
        const streamRef = useRef(null);
        const poseRef = useRef(null);
        const frameRef = useRef(null);
        const pausedRef = useRef(paused);
        const formErrorRef = useRef(formError);
        const currentPoseRef = useRef(currentPose);
        const deviationStartedAtRef = useRef(null);
        const lastPoseUiUpdateRef = useRef(0);
        const poseHealthRef = useRef({ noPoseSince: null, lastHintAt: 0, lastSendErrorAt: 0 });
        const errorEpisodeReportedRef = useRef(false);
        const [useMock, setUseMock] = useState(demoMode);
        const [mobileDemoOpen, setMobileDemoOpen] = useState(false);
        const [readingMode, setReadingMode] = useState("normal");
        const [trackingQuality, setTrackingQuality] = useState("no_pose");
        const [poseMismatchState, setPoseMismatchState] = useState(null);
        const [mockSignal, setMockSignal] = useState(false);
        const [cameraState, setCameraState] = useState("idle");
        const [cameraIssue, setCameraIssue] = useState("");
        const [permissionDialogOpen, setPermissionDialogOpen] = useState(false);
        const [pendingCorrection, setPendingCorrection] = useState(false);
        const [debounceProgress, setDebounceProgress] = useState(0);
        const [poseMeta, setPoseMeta] = useState({
          angle: null,
          visibleCount: 0,
          label: "等待识别",
          tip: null,
          framing: null,
        });
        const [speaking, setSpeaking] = useState(false);
        const [voiceFrame, setVoiceFrame] = useState(0);
        const lastSpokenAtRef = useRef({});
        const speakingRef = useRef(false);
        const speechTimerRef = useRef(null);
        const [voiceReady, setVoiceReady] = useState(false);
        const [voiceNotice, setVoiceNotice] = useState("");
        const timeLabel = formatTimer(secondsLeft);
        const poseDuration = Math.max(1, currentPose?.duration_sec || 60);
        const progress = Math.max(8, ((poseDuration - secondsLeft) / poseDuration) * 100);
        const correctionTip =
          poseMeta.tip ||
          currentPose?.guidance_tip ||
          "请注意向下沉肩，拉伸脊柱。先把动作放小，再慢慢找回呼吸。";
        const targetMin = currentPose?.target_angle_min ?? 140;
        const targetMax = currentPose?.target_angle_max ?? 180;
        const cameraRequirement = getCameraModeMeta(
          currentPose?.camera_mode_required || "half_body"
        );
        const isFarReadingMode = readingMode === "far";
        const statusLabel = useMock
          ? "离线体验模式"
          : cameraState === "ready"
            ? `${cameraRequirement.short} · ${poseMeta.visibleCount}/33`
            : cameraState === "requesting"
              ? "正在请求摄像头"
              : "准备摄像头";
        const coachTip = poseMismatchState?.mismatched
          ? poseMismatchState.tip
          : formError
            ? correctionTip
            : pendingCorrection
              ? "我看到身体有一点点晃动，先不用急着调整，跟着呼吸慢下来。"
              : currentPose?.guidance_tip || "跟着呼吸慢慢来，动作小一点也可以。";
        const trackingQualityMeta = getTrackingQualityMeta(trackingQuality);
        const angleLabel = Number.isFinite(poseMeta.angle)
          ? `${poseMeta.label} ${poseMeta.angle}°`
          : poseMeta.label;

        const speakText = (text, { bypassThrottle = false } = {}) => {
          if (muted && !bypassThrottle) return false;
          if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
            setVoiceNotice("当前浏览器不支持语音播报，可继续使用文字提醒。");
            return false;
          }

          const now = Date.now();
          const lastSpokenAt = lastSpokenAtRef.current[text] || 0;
          if (!bypassThrottle && (speakingRef.current || now - lastSpokenAt < TTS_THROTTLE_MS)) {
            return false;
          }

          lastSpokenAtRef.current[text] = now;
          speakingRef.current = true;
          setSpeaking(true);
          setVoiceReady(true);
          setVoiceNotice("语音提醒已开启");

          const finishSpeaking = () => {
            speakingRef.current = false;
            setSpeaking(false);
          };

          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = "zh-CN";
          utterance.rate = 0.88;
          utterance.pitch = 1;
          utterance.volume = 0.78;
          utterance.onend = finishSpeaking;
          utterance.onerror = () => {
            setVoiceNotice("语音播报被浏览器拦截，请再点一次语音试播。");
            finishSpeaking();
          };
          window.speechSynthesis.speak(utterance);

          if (speechTimerRef.current) window.clearTimeout(speechTimerRef.current);
          speechTimerRef.current = window.setTimeout(finishSpeaking, 3800);
          return true;
        };

        const handleVoiceButtonClick = () => {
          if (muted) {
            setMuted(false);
            window.setTimeout(() => speakText("语音提醒已开启，我会在需要时轻声提示你。", { bypassThrottle: true }), 0);
            return;
          }

          if (!voiceReady) {
            speakText("语音提醒已开启，我会在需要时轻声提示你。", { bypassThrottle: true });
            return;
          }

          setMuted(true);
          setVoiceNotice("语音提醒已关闭");
          if (window.speechSynthesis) window.speechSynthesis.cancel();
          setSpeaking(false);
          speakingRef.current = false;
        };

        useEffect(() => { pausedRef.current = paused; }, [paused]);
        useEffect(() => { if (demoMode) { setUseMock(true); setTrackingQuality("stable"); } }, [demoMode]);

        useEffect(() => {
          formErrorRef.current = formError;
        }, [formError]);

        const resetPoseFeedback = () => {
          deviationStartedAtRef.current = null;
          errorEpisodeReportedRef.current = false;
          setPendingCorrection(false);
          setDebounceProgress(0);
          if (formErrorRef.current) {
            formErrorRef.current = false;
            setFormError(false);
          }
        };

        const updateFormError = (nextValue) => {
          if (formErrorRef.current === nextValue) return;
          formErrorRef.current = nextValue;
          setFormError(nextValue);
        };

        useEffect(() => {
          currentPoseRef.current = currentPose;
          setMobileDemoOpen(true);
          setPaused(true);
          resetPoseFeedback();
          const timer = window.setTimeout(() => {
            setMobileDemoOpen(false);
            setPaused(false);
          }, 3200);
          return () => window.clearTimeout(timer);
        }, [currentPose?.pose_id]);

        const processPoseResult = (analysis) => {
          const now = performance.now();
          const shouldRefreshUi = now - lastPoseUiUpdateRef.current > 140;

          if (shouldRefreshUi) {
            lastPoseUiUpdateRef.current = now;
            setPoseMeta({ angle: analysis.angle, visibleCount: analysis.visibleCount, label: analysis.label, tip: analysis.tip || null, framing: analysis.framing || null });
            setTrackingQuality(analysis.quality || (analysis.visibleCount >= 18 ? "stable" : analysis.visibleCount > 0 ? "partial_body" : "no_pose"));
            setReadingMode(analysis.framing?.isFar ? "far" : "normal");
            setPoseMismatchState(analysis.mismatch || null);
          }

          if (!analysis.hasDeviation || pausedRef.current) {
            resetPoseFeedback();
            return [];
          }

          if (!deviationStartedAtRef.current) {
            deviationStartedAtRef.current = now;
          }

          const elapsed = now - deviationStartedAtRef.current;
          const nextProgress = Math.min(100, Math.round((elapsed / POSE_DEBOUNCE_MS) * 100));
          if (shouldRefreshUi) {
            setPendingCorrection(elapsed < POSE_DEBOUNCE_MS);
            setDebounceProgress(nextProgress);
          }

          if (elapsed >= POSE_DEBOUNCE_MS) {
            setPendingCorrection(false);
            updateFormError(true);
            if (!errorEpisodeReportedRef.current) {
              errorEpisodeReportedRef.current = true;
              onFormErrorConfirmed?.(
                currentPoseRef.current?.correction_error_key || "shoulder_high"
              );
            }
            return analysis.errorIndices;
          }

          updateFormError(false);
          return [];
        };

        useEffect(() => {
          if (useMock) return;

          let cancelled = false;

          const stopCamera = () => {
            if (frameRef.current) window.cancelAnimationFrame(frameRef.current);
            frameRef.current = null;

            if (poseRef.current?.close) {
              poseRef.current.close();
            }
            poseRef.current = null;

            if (streamRef.current) {
              streamRef.current.getTracks().forEach((track) => track.stop());
            }
            streamRef.current = null;

            const canvas = canvasRef.current;
            if (canvas) {
              const context = canvas.getContext("2d");
              context.clearRect(0, 0, canvas.width, canvas.height);
            }
          };

          const startCamera = async () => {
            resetPoseFeedback();
            setCameraIssue("");
            setCameraState("requesting");

            if (!navigator.mediaDevices?.getUserMedia) {
              setCameraIssue("当前浏览器环境无法访问摄像头。请使用 HTTPS 手机链接，或先进入离线体验模式。");
              setCameraState("fallback");
              setPermissionDialogOpen(true);
              setUseMock(true);
              return;
            }

            if (!window.Pose) {
              setCameraIssue("姿态识别脚本没有加载成功。请检查网络后重试，或先进入离线体验模式。");
              setCameraState("fallback");
              setPermissionDialogOpen(true);
              setUseMock(true);
              return;
            }

            try {
              const constraints =
                cameraMode === "front"
                  ? { video: true }
                  : {
                      video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                      },
                      audio: false,
                    };
              const stream = await navigator.mediaDevices.getUserMedia(constraints);
              if (cancelled) {
                stream.getTracks().forEach((track) => track.stop());
                return;
              }

              streamRef.current = stream;
              const video = videoRef.current;
              if (!video) {
                throw new Error("Video element is not ready.");
              }
              video.srcObject = stream;
              await video.play();

              const pose = new window.Pose({
                locateFile: (file) =>
                  `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`,
              });
              pose.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5,
                selfieMode: cameraMode === "front",
              });
              pose.onResults((results) => {
                if (cancelled) return;
                const landmarks = results.poseLandmarks || [];
                const reliableCount = countReliableLandmarks(landmarks);
                const health = poseHealthRef.current;
                const now = performance.now();

                if (reliableCount > 0) {
                  health.noPoseSince = null;
                  setCameraIssue("");
                } else {
                  if (!health.noPoseSince) health.noPoseSince = now;
                  if (now - health.noPoseSince > 1600 && now - health.lastHintAt > 1400) {
                    health.lastHintAt = now;
                    setCameraIssue("还没捕捉到身体关键点，请退后一点，并让头部和肩膀进入画面。");
                  }
                }

                const latestPose = currentPoseRef.current || currentPose;
                const analysis = evaluatePoseDeviation(landmarks, latestPose);
                const activeErrorIndices = processPoseResult(analysis);
                drawPoseCanvas(canvasRef.current, videoRef.current, landmarks, {
                  mirrored: cameraMode === "front",
                  errorIndices: activeErrorIndices,
                });
              });
              poseRef.current = pose;
              setCameraState("ready");
              setPermissionDialogOpen(false);

              const detectFrame = async () => {
                if (cancelled || !poseRef.current) return;
                if (!pausedRef.current && video.readyState >= 2) {
                  try {
                    await poseRef.current.send({ image: video });
                  } catch (sendError) {
                    const health = poseHealthRef.current;
                    const now = performance.now();
                    if (now - health.lastSendErrorAt > 2200) {
                      health.lastSendErrorAt = now;
                      setCameraIssue("姿态识别模型正在加载或网络资源较慢，请稍等；若一直没有节点，可切换离线体验。");
                    }
                  }
                }
                frameRef.current = window.requestAnimationFrame(detectFrame);
              };
              detectFrame();
            } catch (error) {
              if (cancelled) return;
              setCameraIssue("需要摄像头权限以开启实时 AI 姿势指导。已为你切换到离线体验模式，可稍后重试摄像头。");
              setCameraState("fallback");
              setPermissionDialogOpen(true);
              setUseMock(true);
            }
          };

          startCamera();

          return () => {
            cancelled = true;
            stopCamera();
          };
        }, [cameraMode, useMock]);

        useEffect(() => {
          if (!useMock) return;
          setCameraState("mock");
          setPoseMeta({
            angle: mockSignal ? 126 : 164,
            visibleCount: 33,
            label: "模拟脊柱线",
            tip: null,
            framing: {
              isFar: currentPoseRef.current?.camera_mode_required === "full_body",
              label: "远距离大字模式",
              helper: "你站得比较远，我会放大关键提示，主要听语音即可。",
            },
          });

          if (!mockSignal) {
            resetPoseFeedback();
            return;
          }

          deviationStartedAtRef.current = performance.now();
          setPendingCorrection(true);
          setDebounceProgress(0);
          updateFormError(false);

          const interval = window.setInterval(() => {
            const elapsed = performance.now() - deviationStartedAtRef.current;
            const nextProgress = Math.min(100, Math.round((elapsed / POSE_DEBOUNCE_MS) * 100));
            setDebounceProgress(nextProgress);

            if (elapsed >= POSE_DEBOUNCE_MS) {
              setPendingCorrection(false);
              updateFormError(true);
              if (!errorEpisodeReportedRef.current) {
                errorEpisodeReportedRef.current = true;
                onFormErrorConfirmed?.(
                  currentPoseRef.current?.correction_error_key || "shoulder_high"
                );
              }
            }
          }, CV_FRAME_INTERVAL_MS);

          return () => window.clearInterval(interval);
        }, [useMock, mockSignal, setFormError]);

        useEffect(() => {
          if (!formError || muted) {
            setSpeaking(false);
            speakingRef.current = false;
            if (speechTimerRef.current) window.clearTimeout(speechTimerRef.current);
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            return;
          }

          const trySpeak = () => {
            speakText(correctionTip);
          };

          trySpeak();
          const interval = window.setInterval(trySpeak, 1000);
          return () => {
            window.clearInterval(interval);
            if (speechTimerRef.current) window.clearTimeout(speechTimerRef.current);
            if (window.speechSynthesis) window.speechSynthesis.cancel();
          };
        }, [formError, muted, correctionTip]);

        useEffect(() => {
          if (!speaking) return;
          const interval = window.setInterval(() => {
            setVoiceFrame((value) => (value + 1) % 8);
          }, 180);
          return () => window.clearInterval(interval);
        }, [speaking]);

        return (
          <div className="mx-auto flex max-w-[430px] flex-col gap-3 lg:max-w-6xl lg:gap-4">
            {permissionDialogOpen && (
              <div className="fixed inset-0 z-30 flex items-center justify-center bg-forest/20 px-4 py-6 backdrop-blur-sm">
                <section className="w-full max-w-sm rounded-2xl border border-white/80 bg-cream p-5 shadow-soft">
                  <div className="flex h-11 w-11 items-center justify-center rounded-2xl bg-[#FFF3EB] text-clay">
                    <Icon type="camera" />
                  </div>
                  <h3 className="mt-4 text-xl font-semibold text-forest">
                    需要摄像头权限以开启 AI 指导
                  </h3>
                  <p className="mt-3 text-sm leading-6 text-forest/66">
                    没关系，我已经为你切到离线体验模式。你可以先看完整流程，也可以稍后重新授权摄像头。
                  </p>
                  <div className="mt-5 grid gap-2 sm:grid-cols-2">
                    <button
                      onClick={() => setPermissionDialogOpen(false)}
                      className="rounded-xl bg-sage px-4 py-3 text-sm font-semibold text-white transition hover:bg-[#657BEA] active:translate-y-[1px]"
                    >
                      继续演示
                    </button>
                    <button
                      onClick={() => {
                        setPermissionDialogOpen(false);
                        setCameraIssue("");
                        setMockSignal(false);
                        setUseMock(false);
                        resetPoseFeedback();
                      }}
                      className="rounded-xl border border-sand bg-cream px-4 py-3 text-sm font-semibold text-forest transition hover:bg-sand/45 active:translate-y-[1px]"
                    >
                      重试摄像头
                    </button>
                  </div>
                </section>
              </div>
            )}
            <section className="training-card relative overflow-hidden rounded-[28px] p-3.5 text-white shadow-soft sm:rounded-[32px] sm:p-5">
              {isFarReadingMode && (<FarReadingHero pose={currentPose} timeLabel={timeLabel} message={coachTip} trackingQualityMeta={trackingQualityMeta} speaking={speaking && !muted} />)}
              {cameraIssue && (
                <div className="mb-4 flex flex-col gap-3 rounded-[24px] border border-clay/25 bg-clay/12 p-4 text-sm text-white/72 sm:flex-row sm:items-center sm:justify-between">
                  <div>
                    <p className="font-semibold text-white">需要摄像头权限以开启实时指导</p>
                    <p className="mt-1 leading-6">{cameraIssue}</p>
                  </div>
                  <button
                    onClick={() => {
                      setUseMock((value) => !value);
                      setMockSignal(false);
                      setCameraIssue("");
                      setPermissionDialogOpen(false);
                    }}
                    className="shrink-0 rounded-[18px] bg-lime px-4 py-2 font-semibold text-night shadow-sm transition hover:bg-[#FFEBA0] active:translate-y-[1px]"
                  >
                    {useMock ? "重试摄像头" : "进入离线体验"}
                  </button>
                </div>
              )}
              <div className="flex items-start justify-between gap-3 md:items-center">
                <div>
                  <p className="text-sm font-semibold text-lime/90">
                    正在训练 · 第 {poseIndex + 1} / {poseCount} 个动作
                  </p>
                  <h2 className="mt-1 text-2xl font-semibold leading-tight text-white sm:text-4xl">
                    {currentPose?.pose_name || "猫牛式"}
                  </h2>
                  <p className="mt-1 line-clamp-1 max-w-[230px] text-xs leading-5 text-white/58 sm:max-w-xl sm:text-sm">
                    {courseInsight || "今天先求舒服和稳定，不追求动作幅度。"}
                  </p>
                </div>
                <div className="flex shrink-0 flex-col items-end gap-2 sm:flex-row sm:items-center sm:gap-3">
                  <span className="rounded-full bg-lime px-3 py-1.5 text-base font-semibold tabular-nums text-night sm:px-4 sm:py-2 sm:text-lg">
                    {timeLabel}
                  </span>
                  <button
                    onClick={() => setPaused((value) => !value)}
                    className="inline-flex items-center gap-1.5 rounded-[18px] bg-white/10 px-3 py-1.5 text-sm font-semibold text-white transition hover:bg-white/16 active:translate-y-[1px] sm:gap-2 sm:px-4 sm:py-2"
                  >
                    <Icon type={paused ? "play" : "pause"} />
                    {paused ? "继续" : "暂停"}
                  </button>
                  <button
                    onClick={onExit}
                    className="hidden items-center gap-2 rounded-[18px] border border-white/12 bg-white/8 px-4 py-2 text-sm font-semibold text-white/82 transition hover:bg-white/14 active:translate-y-[1px] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lime/35 sm:inline-flex"
                  >
                    <Icon type="home" />
                    退出练习
                  </button>
                </div>
              </div>
              <div className="mt-3 h-2 overflow-hidden rounded-full bg-white/12 sm:mt-5">
                <div
                  className="h-full rounded-full bg-lime transition-all duration-500"
                  style={{ width: `${progress}%` }}
                />
              </div>
            </section>

            <div className="hidden lg:block">
              <CourseInsightCard insight={courseInsight} />
            </div>

            <MobileDemoDock pose={currentPose} expanded={mobileDemoOpen && !isFarReadingMode} compact={isFarReadingMode} onToggle={() => setMobileDemoOpen((value) => !value)} />

            <section className="grid gap-3 lg:grid-cols-[minmax(280px,0.4fr)_minmax(0,0.6fr)] lg:gap-4">
              <div className="hidden lg:block">
                <DemoPoseCard pose={currentPose} />
              </div>

              <div className="order-1 relative overflow-hidden rounded-[32px] border border-night/10 bg-night p-3 shadow-soft shadow-inset sm:p-4 lg:order-2">
                <div className="camera-surface relative h-[51dvh] min-h-[360px] max-h-[480px] overflow-hidden rounded-[26px] sm:h-[54dvh] sm:min-h-[520px] sm:max-h-[560px] lg:h-auto lg:min-h-[650px] lg:max-h-none">
                <div className="mat-perspective absolute bottom-10 left-1/2 h-[300px] w-[260px] -translate-x-1/2 rounded-[36px] bg-sage/10" />
                {useMock ? (
                  <SkeletonOverlay formError={formError} />
                ) : (
                  <>
                    <video
                      ref={videoRef}
                      className="absolute inset-0 h-full w-full object-cover opacity-90"
                      style={{ transform: cameraMode === "front" ? "scaleX(-1)" : "none" }}
                      playsInline
                      muted
                      autoPlay
                    />
                    <canvas
                      ref={canvasRef}
                      className="absolute inset-0 h-full w-full"
                      aria-label="MediaPipe Pose 实时骨骼关键点"
                    />
                    {cameraState !== "ready" && (
                      <div className="absolute inset-0 grid place-items-center bg-linen/48 backdrop-blur-[2px]">
                        <div className="rounded-[24px] bg-cream/90 px-5 py-4 text-center shadow-sm">
                          <p className="text-sm font-semibold text-sage">正在准备实时姿态识别</p>
                          <p className="mt-2 text-sm text-forest/62">请允许浏览器使用摄像头。</p>
                        </div>
                      </div>
                    )}
                  </>
                )}

                <div className="absolute left-4 top-4 rounded-full border border-white/16 bg-night/58 px-3 py-1.5 text-xs font-semibold text-white/78 shadow-sm backdrop-blur-md">{statusLabel}</div>
                <div className={["absolute left-4 right-4 top-14 max-w-[calc(100%-2rem)] rounded-[18px] px-3 py-1.5 text-xs font-semibold shadow-sm backdrop-blur-md sm:right-auto sm:max-w-[360px]", trackingQualityMeta.tone].join(" ")}><span>{trackingQualityMeta.label}</span>{trackingQuality !== "stable" && (<span className="ml-2 font-medium opacity-72">{trackingQualityMeta.helper}</span>)}</div>

                <div className="absolute right-4 top-4 flex max-w-[190px] flex-col items-end gap-2">
                  <button
                    onClick={() => {
                      setUseMock((value) => !value);
                      setMockSignal(false);
                      setCameraIssue("");
                      setPermissionDialogOpen(false);
                      resetPoseFeedback();
                    }}
                    className="rounded-[18px] bg-white/88 px-4 py-2 text-sm font-semibold text-forest shadow-sm transition hover:bg-cream active:translate-y-[1px]"
                  >
                    {useMock ? "重试摄像头" : DEBUG_MODE ? "Mock 测试" : "离线体验"}
                  </button>
                  {useMock && DEBUG_MODE && (
                    <button
                      onClick={() => setMockSignal((value) => !value)}
                      className={[
                        "rounded-xl px-4 py-2 text-sm font-semibold shadow-sm transition active:translate-y-[1px]",
                        mockSignal
                          ? "bg-clay text-white hover:bg-[#DF7E58]"
                          : "bg-white/88 text-forest hover:bg-cream",
                      ].join(" ")}
                    >
                      {mockSignal ? "恢复自然状态" : "模拟身体提醒"}
                    </button>
                  )}
                </div>

                {(pendingCorrection || formError) && (
                  <div className="absolute right-4 top-16 overflow-hidden rounded-full border border-white/16 bg-night/64 px-3 py-1.5 text-xs font-semibold text-white/76 shadow-sm backdrop-blur-md">

                </div>
                {!compact && (<p className="mt-1 line-clamp-1 text-xs leading-5 text-forest/58">
                  {pose?.key_points_tip || "保持稳定呼吸，动作放慢。"}
                </p>)}
              </div>
              {!compact && (<span className="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-mist text-sage">
                <Icon type={expanded ? "close" : "play"} className="h-4 w-4" />
              </span>)}
            </button>

            {expanded && (
              <div className="mt-3 animate-settle overflow-hidden rounded-[22px] bg-linen p-2">
                <div className="relative h-[230px] overflow-hidden rounded-[20px] bg-cream">
                  <img
                    src={demoSrc}
                    alt={`${pose?.pose_name || "瑜伽动作"}真人示范图`}
                    onError={(event) => {
                      event.currentTarget.src = DEMO_PLACEHOLDER_SVG;
                    }}
                    className="h-full w-full object-cover"
                  />
                </div>
                <div className="mt-2 rounded-[18px] bg-cream px-3 py-2.5">
                  <p className="text-xs font-semibold text-sage">动作要领 · {targetMin}°~{targetMax}°</p>
                  <p className="mt-1 text-sm leading-6 text-forest/70">
                    {pose?.key_points_tip || "保持稳定呼吸，动作放慢，停在身体舒服的位置。"}
                  </p>
                  <p className="mt-2 text-xs leading-5 text-forest/50">{cameraMeta.helper}</p>
                </div>
              </div>
            )}
          </section>
        );
      }

      function DemoPoseCard({ pose, className = "" }) {
        const targetMin = pose?.target_angle_min ?? 140;
        const targetMax = pose?.target_angle_max ?? 180;
        const cameraMeta = getCameraModeMeta(pose?.camera_mode_required || "half_body");
        const demoSrc =
          pose?.demo_media_url ||
          createPoseDemoPlaceholder(
            pose?.pose_name || "标准示范",
            pose?.key_points_tip || "动作放慢，保持自然呼吸。",
            pose?.demo_visual_key || inferDemoVisualKey(pose?.pose_name, pose?.pose_id)
          );

        return (
          <aside className={["grid grid-cols-[108px_minmax(0,1fr)] gap-3 overflow-hidden rounded-[26px] border border-white/80 bg-cream p-3 shadow-soft sm:grid-cols-[160px_minmax(0,1fr)] sm:p-4 lg:flex lg:min-h-[650px] lg:flex-col lg:rounded-[32px]", className].join(" ")}>
            <div className="order-2 flex min-w-0 flex-col justify-between lg:order-1">
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                <p className="text-sm font-semibold text-sage">真人示范图</p>
                <h3 className="mt-1 truncate text-xl font-semibold leading-tight text-forest sm:text-2xl">
                  {pose?.pose_name || "猫牛式"}
                </h3>
                </div>
                <span className="hidden shrink-0 rounded-full bg-night px-3 py-1 text-xs font-semibold text-lime sm:inline-flex">
                  {cameraMeta.short}
                </span>
              </div>
              <p className="mt-2 line-clamp-2 text-sm leading-6 text-forest/68 lg:hidden">
                {pose?.key_points_tip || "保持稳定呼吸，动作放慢，停在身体舒服的位置。"}
              </p>
            </div>

            <div className="relative order-1 h-[116px] overflow-hidden rounded-[22px] bg-linen sm:h-[152px] lg:order-2 lg:mt-4 lg:h-[430px] lg:min-h-[430px] lg:flex-none lg:rounded-[26px]">
              <div id="demo-media" className="h-full w-full">
                <img
                  src={demoSrc}
                  alt={`${pose?.pose_name || "瑜伽动作"}真人示范图`}
                  onError={(event) => {
                    event.currentTarget.src = DEMO_PLACEHOLDER_SVG;
                  }}
                  className="h-full w-full object-cover"
                />
              </div>
              <div className="absolute inset-x-3 bottom-3 hidden rounded-[22px] bg-night/78 p-3 shadow-sm backdrop-blur-md lg:block">
                <p className="text-xs font-semibold text-lime/70">动作要领</p>
                <p className="mt-1 text-sm leading-6 text-white/78">
                  {pose?.key_points_tip || "保持稳定呼吸，动作放慢，停在身体舒服的位置。"}
                </p>
                <p className="mt-2 text-xs leading-5 text-white/50">
                  {cameraMeta.helper} · {targetMin}°~{targetMax}°
                </p>
              </div>
            </div>
          </aside>
        );
      }

      function ControlButton({ icon, label, onClick }) {
        return (
          <button
            onClick={onClick}
            className="flex min-h-16 flex-col items-center justify-center gap-1 rounded-[22px] bg-white/10 px-2 py-3 text-center text-xs font-semibold text-white transition hover:bg-white/16 active:translate-y-[1px] sm:min-h-14 sm:flex-row sm:gap-2 sm:text-sm"
          >
            <Icon type={icon} className="h-5 w-5 shrink-0 text-lime" />
            <span className="leading-tight">{label}</span>
          </button>
        );
      }

      function SharePosterModal({ onClose, sessionStats, sessionSummary }) {
        const [saved, setSaved] = useState(false);
        const posterCanvasRef = useRef(null);
        const metrics = buildSessionMetrics(sessionStats);
        const durationMin = Math.max(1, Math.round((sessionStats?.durationSec || 60) / 60));
        const posterTitle = `我完成了一次 ${durationMin} 分钟轻柔瑜伽。`;
        const posterNote =
          sessionSummary?.ai_feedback ||
          "动作不用很大，能觉察到身体变化就很好。";
        const bestPoseName = sessionStats?.bestPoseName || "今日高光体式";

        useEffect(() => {
          const handleKeyDown = (event) => {
            if (event.key === "Escape") onClose();
          };
          window.addEventListener("keydown", handleKeyDown);
          return () => window.removeEventListener("keydown", handleKeyDown);
        }, [onClose]);

        const savePoster = () => {
          const canvas = posterCanvasRef.current;
          if (!canvas) return;

          const ctx = canvas.getContext("2d");
          const width = canvas.width;
          const height = canvas.height;
          const centerX = width / 2;

          ctx.clearRect(0, 0, width, height);

          const background = ctx.createLinearGradient(0, 0, width, height);
          background.addColorStop(0, "#FFFFFF");
          background.addColorStop(0.56, "#F7F8F2");
          background.addColorStop(1, "#EAF8F7");
          ctx.fillStyle = background;
          ctx.fillRect(0, 0, width, height);

          ctx.fillStyle = "rgba(106, 196, 190, 0.08)";
          ctx.beginPath();
          ctx.ellipse(centerX, 500, 148, 28, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#6AC4BE";
          roundRect(ctx, 42, 44, 62, 62, 20);
          ctx.fill();

          ctx.fillStyle = "#FFFFFF";
          ctx.font = "700 30px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("瑜", 73, 84);

          ctx.textAlign = "left";
          ctx.fillStyle = "#27324A";
          ctx.font = "700 34px system-ui, sans-serif";
          ctx.fillText("灵瑜 AI", 122, 70);
          ctx.fillStyle = "rgba(39, 50, 74, 0.58)";
          ctx.font = "500 18px system-ui, sans-serif";
          ctx.fillText(bestPoseName, 122, 100);

          drawPosterSkeleton(ctx, centerX, 175, "#6AC4BE");

          ctx.fillStyle = "#27324A";
          ctx.font = "700 38px system-ui, sans-serif";
          wrapCanvasText(ctx, posterTitle, 42, 610, 420, 46);

          const statY = 725;
          metrics.forEach((metric, index) => {
            const x = 42 + index * 148;
            ctx.fillStyle = "rgba(255, 253, 252, 0.74)";
            roundRect(ctx, x, statY, 124, 92, 24);
            ctx.fill();
            ctx.fillStyle = "#6AC4BE";
            ctx.font = "700 28px system-ui, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(metric.value.replace("分钟", "分"), x + 62, statY + 42);
            ctx.fillStyle = "rgba(39, 50, 74, 0.58)";
            ctx.font = "600 15px system-ui, sans-serif";
            ctx.fillText(metric.label, x + 62, statY + 70);
          });

          ctx.textAlign = "left";
          ctx.fillStyle = "rgba(39, 50, 74, 0.66)";
          ctx.font = "500 18px system-ui, sans-serif";
          wrapCanvasText(ctx, posterNote.slice(0, 54), 42, 872, 420, 28);

          const link = document.createElement("a");
          link.download = "lingyu-ai-daka-poster.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
          setSaved(true);
        };

        return (
          <div
            className="fixed inset-0 z-20 flex items-center justify-center overflow-y-auto bg-forest/24 px-4 py-4 backdrop-blur-sm sm:py-8"
            onClick={(event) => {
              if (event.target === event.currentTarget) onClose();
            }}
            role="presentation"
          >
            <section
              className="relative my-auto max-h-[calc(100dvh-2rem)] w-full max-w-md overflow-y-auto rounded-2xl bg-cream p-4 shadow-soft shadow-inset sm:max-h-[calc(100dvh-4rem)] sm:p-5"
              role="dialog"
              aria-modal="true"
              aria-label="分享卡预览"
            >
              <button
                onClick={onClose}
                className="absolute right-4 top-4 z-10 flex h-10 w-10 items-center justify-center rounded-full bg-linen text-forest shadow-sm transition hover:bg-sand/55 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sage/35"
                aria-label="关闭分享卡"
              >
                <Icon type="close" />
              </button>

              <div className="overflow-hidden rounded-2xl bg-linen">
                <div className="relative min-h-[640px] p-6">
                  <div className="absolute inset-0 bg-[radial-gradient(circle_at_50%_10%,rgba(255,253,252,1),rgba(232,220,209,0.58)_45%,rgba(90,122,102,0.16))]" />
                  <div className="relative flex h-full min-h-[588px] flex-col">
                    <div className="flex items-center gap-3">
                      <span className="flex h-11 w-11 items-center justify-center rounded-2xl bg-sage text-white">
                        <Icon type="leaf" />
                      </span>
                      <div>
                        <p className="text-lg font-semibold text-forest">灵瑜 AI</p>
                        <p className="text-xs text-forest/58">{bestPoseName}</p>
                      </div>
                    </div>

                    <div className="my-7 rounded-2xl bg-cream/78 p-3 shadow-lifted">
                      <div className="camera-surface relative min-h-[360px] overflow-hidden rounded-2xl">
                        <div className="mat-perspective absolute bottom-8 left-1/2 h-[210px] w-[190px] -translate-x-1/2 rounded-[30px] bg-sage/10" />
                        <SkeletonOverlay compact />
                      </div>
                    </div>

                    <div className="mt-auto">
                      <p className="text-3xl font-semibold leading-tight text-forest">
                        {posterTitle}
                      </p>
                      <div className="mt-5 grid grid-cols-3 gap-2">
                        {metrics.map((metric) => (
                          <div key={metric.label} className="rounded-2xl bg-cream/82 p-3 text-center">
                            <p className="text-xl font-semibold text-sage">{metric.value.replace("分钟", "分")}</p>
                            <p className="mt-1 text-[11px] font-semibold text-forest/58">{metric.label}</p>
                          </div>
                        ))}
                      </div>
                      <p className="mt-5 text-sm leading-6 text-forest/66">
                        {posterNote}
                      </p>
                    </div>
                  </div>
                </div>
              </div>

              <div className="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <canvas
                  ref={posterCanvasRef}
                  width="512"
                  height="960"
                  className="hidden"
                  aria-hidden="true"
                />
                <p className="text-sm text-forest/58" aria-live="polite">
                  {saved ? "打卡海报已生成" : "适合发到社交平台的练习卡片"}
                </p>
                <button
                  onClick={savePoster}
                  className="whitespace-nowrap rounded-xl bg-sage px-4 py-2 text-sm font-semibold text-white transition hover:bg-[#657BEA] active:translate-y-[1px] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sage/35"
                >
                  {saved ? "再次保存" : "一键保存打卡海报"}
                </button>
                <button
                  onClick={onClose}
                  className="rounded-xl border border-sand bg-cream px-4 py-2 text-sm font-semibold text-forest transition hover:bg-sand/45 active:translate-y-[1px] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sage/35"
                >
                  关闭
                </button>
              </div>
            </section>
          </div>
        );
      }

      function roundRect(ctx, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }

      function drawPosterSkeleton(ctx, centerX, top, color) {
        const points = {
          head: [centerX, top + 38],
          neck: [centerX, top + 94],
          shoulderL: [centerX - 58, top + 132],
          shoulderR: [centerX + 58, top + 132],
          elbowL: [centerX - 82, top + 208],
          elbowR: [centerX + 82, top + 208],
          handL: [centerX - 96, top + 280],
          handR: [centerX + 96, top + 280],
          hipL: [centerX - 38, top + 264],
          hipR: [centerX + 38, top + 264],
          kneeL: [centerX - 54, top + 360],
          kneeR: [centerX + 54, top + 360],
          ankleL: [centerX - 70, top + 458],
          ankleR: [centerX + 70, top + 458],
        };
        const lines = [
          ["head", "neck"],
          ["neck", "shoulderL"],
          ["neck", "shoulderR"],
          ["shoulderL", "elbowL"],
          ["elbowL", "handL"],
          ["shoulderR", "elbowR"],
          ["elbowR", "handR"],
          ["neck", "hipL"],
          ["neck", "hipR"],
          ["hipL", "hipR"],
          ["hipL", "kneeL"],
          ["kneeL", "ankleL"],
          ["hipR", "kneeR"],
          ["kneeR", "ankleR"],
        ];

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.shadowColor = "rgba(106, 196, 190, 0.22)";
        ctx.shadowBlur = 18;
        ctx.strokeStyle = color;
        ctx.lineWidth = 8;
        lines.forEach(([from, to]) => {
          const a = points[from];
          const b = points[to];
          ctx.beginPath();
          ctx.moveTo(a[0], a[1]);
          ctx.lineTo(b[0], b[1]);
          ctx.stroke();
        });

        Object.values(points).forEach(([x, y]) => {
          ctx.fillStyle = "rgba(106, 196, 190, 0.16)";
          ctx.beginPath();
          ctx.arc(x, y, 22, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(x, y, 10, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
        let line = "";
        let currentY = y;
        for (const char of text) {
          const testLine = line + char;
          if (ctx.measureText(testLine).width > maxWidth && line) {
            ctx.fillText(line, x, currentY);
            line = char;
            currentY += lineHeight;
          } else {
            line = testLine;
          }
        }
        if (line) ctx.fillText(line, x, currentY);
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
